<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<script type="text/javascript" src="tale.js"></script>
<title>Марго ищет котенка</title><style>
html{font-size:calc(10px + 0.5vw + 0.5vmax)}	
body{margin:0;font-family:sans-serif;background-image:linear-gradient(to bottom,red,black);color:#ffffff}
button{font-size:1rem;padding:9px 5px;margin:2px;border:none;border-radius:8px;
cursor:pointer;background:#5a189a;color:white;transition:0.2s}
button:hover{transform:scale(1.05);background:#7b2cbf}

#bg{position:fixed;inset:8rem 0 0 0;background-size:cover;background-position:center;transition:0.5s}
#ui{position:relative;margin:auto;padding:5px;}
#logtxt{color:red;font-weight:bold}
#stor{font-weight:bold;background:rgba(0,0,0,0.5);display:inline-block}
.sld{width:100%;height:77vh;object-fit:fill;display:none}
.item{position:absolute;top:0;left:0;display:block;scale:0.05;transition:2s}
.panel{background:rgba(0,0,0,0.75);padding:5px 15px;border-radius:10px;margin:2px auto}
.bar{height:9px;background:#333;border-radius:8px;overflow:hidden}
.inner{height:100%;transition:0.4s}
.hp{background:#ff4d6d}
.mp{background:#4da6ff}
.energy{background:#9acd32}
.exp{background:#ffd700}
</style></head><body>
	
<div id="bg"></div><div id="ui">
<div class="panel">
❤️ HP <b style="float:right">📊 Уровень: <span id="lvl"></span> | 💰 Золото: <span id="gold"></span> | 📋 Часть: <span id="chpt"></span></b>
<div class="bar"><div id="hp" class="inner hp"></div></div>
🔮 MP<div class="bar"><div id="mp" class="inner mp"></div></div>
⚡ Энергия<div class="bar"><div id="energy" class="inner energy"></div></div>
⭐ Опыт<div class="bar"><div id="exp" class="inner exp"></div></div>
<div id="logtxt" class="panel"></div></div>
<div id="choice"></div>
<div id="stor"></div>
<img id="slde" class="sld" src="game/ball.webp">
<img id="thund" class="sld" src="game/thund.webp">
<img id="item1" class="item" src="game/crys1.png" onclick="clean(1)">
<img id="item2" class="item" src="game/crys2.png" onclick="clean(2)">
<img id="item3" class="item" src="game/crys3.png" onclick="clean(3)">
<img id="item4" class="item" src="game/crys4.png" onclick="clean(4)"></div>

<script>
let player={level:1,exp:0,nextExp:100,hp:120,maxHp:120,mp:80,maxMp:80,energy:100,gold:25,chapter:0,corruption:0};
let choices=document.getElementById("choice");
let loga=document.getElementById("logtxt");
let story=document.getElementById("stor");
let itm=["",document.getElementById("item1"),document.getElementById("item2"),document.getElementById("item3"),document.getElementById("item4")];let blocked = false;

function updateUI(){lvl.innerText=player.level;
gold.innerText=player.gold;chpt.innerText=player.chapter;
hp.style.width=(player.hp/player.maxHp*100)+"%";
mp.style.width=(player.mp/player.maxMp*100)+"%";
energy.style.width=player.energy+"%";
exp.style.width=(player.exp/player.nextExp*100)+"%"}

function addChoice(text,action){let btn=document.createElement("button");btn.textContent=text;
btn.onclick=action;choices.appendChild(btn)}

function clearChoices(){choices.innerHTML="";loga.innerHTML="";}
function rand(n){return Math.floor(Math.random()*n);}
function changeBg(url){bg.style.backgroundImage=`url(${url})`;}

function gainExp(x){player.exp+=x;
if(player.exp>=player.nextExp){player.exp=0;player.level++;
player.maxHp+=25;player.maxMp+=15;player.hp=player.maxHp;
player.mp=player.maxMp;player.nextExp+=75;
story.innerHTML="Ты стала сильнее... Но тьма тоже растёт."; changeBg("game/bg-pw.jpg");for(i=1;i<5;i++)itm[i].style.display="block"} updateUI()}

function chooseClass(){changeBg("game/bg0.jpg");
story.innerHTML="Выбери путь магии. В этом городе свет не всегда побеждает тьму.";clearChoices();
addChoice("✨ Маг света",()=>{player.chapter=0;player.maxHp+=40;player.hp=player.maxHp;startGame()});
addChoice("🌙 Ведьма луны",()=>{player.chapter=1;
player.maxMp+=40;player.mp=player.maxMp;startGame()});
addChoice("🔥 Пламя бездны",()=>{player.chapter=2;
player.corruption+=5;startGame();})}

function startGame(){changeBg("game/bg1.jpg");
story.innerHTML=txt[player.chapter][0];
clearChoices();
addChoice("Исследовать город",cityHub);updateUI()}

function cityHub(){changeBg("game/bg2.jpg");
if(txt[player.chapter][player.level])story.innerHTML=txt[player.chapter][player.level];
else story.innerHTML="Продолжение следует… 🔜";
clearChoices();
addChoice("Башня магов",()=>explore(0,"game/bg-mag.jpg",txt1));
addChoice("Заражённый парк",()=>explore(1,"game/bg-park.jpg",txt2));
addChoice("Порт теней",()=>explore(0,"game/bg-port.jpg",txt3));
addChoice("Подземный разлом",()=>battle("game/bt2.jpg","Страж Разлома",200,30,true))}

function explore(it,bgpl,place){changeBg(bgpl);
if(place[player.chapter][player.level])story.innerHTML=place[player.chapter][player.level];
else story.innerHTML=place[player.chapter][0];

clearChoices(); let r=rand(5);
if(r==0){battle("game/bt1.jpg","Теневой дух",100,20,false); return}
if(r==1){player.gold+=15;loga.innerHTML="Ты находишь тёмные монеты."}
if(r==2){player.energy-=20;loga.innerHTML="Шёпот сводит тебя с ума."}
if(r==3){}
if(it==1&&r!=0){itm[r].style.transform="scale(20)";
itm[r].style.left=rand(45)+"vh";itm[r].style.top=rand(48)+22+"vh";
setTimeout(hide,2000)}
addChoice("Вернуться",cityHub);updateUI()}

function battle(bgbt,name,enemyHp,damage,boss=false){
story.innerHTML="⚔💀 Бой: 👹 "+name;
clearChoices(); changeBg(bgbt);
function enemyTurn(){player.hp-=damage;
if(player.hp<=0)endingBad();updateUI()}
function attack(){document.getElementById("slde").style.display="block";setTimeout(hide,1500);
enemyHp-=25+player.level*5;
if(enemyHp<=0)setTimeout(victory,1000);else enemyTurn()}

function heavySpell(){if(player.mp<30){loga.innerHTML="Недостаточно маны.";return}
document.getElementById("thund").style.display="block";setTimeout(hide,1000);
player.mp-=30;enemyHp-=60;player.corruption+=2;
if(enemyHp<=0){victory()} else{enemyTurn()}updateUI()}

function heal(){if(player.mp<20){loga.innerHTML="Недостаточно маны.";return}
player.mp-=20;player.hp+=40;
if(player.hp>player.maxHp) player.hp=player.maxHp;
enemyTurn();updateUI()}

function victory(){gainExp(boss?150:60);player.gold+=boss?50:20;
if(boss){story.innerHTML="Ты разрушила разлом... но чувствуешь, как тьма коснулась души.";player.chapter++}
else story.innerHTML=name+" повержен.";
clearChoices();changeBg("game/bg-pw.jpg");addChoice("Продолжить",cityHub);updateUI()}

addChoice("🗡 Атака 🗡",attack);
addChoice("Мощное заклинание(-30MP)",heavySpell);
addChoice("Исцеление(-20MP)",heal)}

function endingBad(){story.innerHTML="Тьма поглотила Марго. Город остался без надежды.";
clearChoices(); changeBg("game/bad.jpg");
addChoice("Начать заново",()=>location.reload())}
updateUI();chooseClass();

function hide(){document.getElementById("slde").style.display="none";
document.getElementById("thund").style.display="none";
for(i=1;i<5;i++)itm[i].style.transform="scale(0.05)"}
function clean(ii){itm[ii].style.display="none";gainExp(30);loga.innerHTML="Ты очищаешь заражённый символ."}
</script></body></html>
