<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<script type="text/javascript" src="tale.js"></script>
<link rel="preload" as="image" href="game/bg1.jpg">
<link rel="preload" as="image" href="game/bg2.jpg">
<link rel="preload" as="image" href="game/bg-mag.jpg">
<link rel="preload" as="image" href="game/bg-park.jpg">
<link rel="preload" as="image" href="game/bg-port.jpg">
<link rel="preload" as="image" href="game/bg-rift.jpg">
<link rel="preload" as="image" href="game/bt1.jpg">
<link rel="preload" as="image" href="game/bt2.jpg">
<title>Марго ищет котенка</title><style>
html{font-size:calc(10px + 0.5vw + 0.5vmax)}	
body{margin:0;font-family:sans-serif;background-image:linear-gradient(to bottom,red,black);color:#ffffff}
button{font-size:1rem;padding:9px 5px;margin:2px;border:none;border-radius:8px;
cursor:pointer;background:#5a189a;color:white;transition:0.2s}
button:hover{transform:scale(1.05);background:#7b2cbf}

#bg{position:fixed;inset:9rem 0 0 0;background-size:cover;background-position:center;transition:0.5s}
#ui{position:relative;margin:auto;padding:5px;}
#logtxt{color:red;font-weight:bold}
#stor{font-weight:bold;background:rgba(0,0,0,0.5);display:inline-block}
#mgbl{display:none}
#coin{position:absolute;display:none}
.sld{width:100%;height:77vh;object-fit:fill;display:none}
.item{position:absolute;top:0;left:0;display:block;scale:0.05;transition:2s}
.panel{background:rgba(0,0,0,0.75);padding:5px 15px;border-radius:10px;margin:2px auto}
.bar{height:9px;background:#333;border-radius:8px;overflow:hidden}
.inner{height:100%;transition:0.4s}
.hp{background:#ff4d6d}
.mp{background:#4da6ff}
.energy{background:#9acd32}
.exp{background:#ffd700}
</style></head><body>
	
<div id="bg"></div><div id="ui">
<div class="panel">
❤️ HP <b style="float:right">📊 Уровень: <span id="lvl"></span> | 💰 Золото: <span id="gold"></span> | 📋 Часть: <span id="chpt"></span></b>
<div class="bar"><div id="hp" class="inner hp"></div></div>
🔮 MP<div class="bar"><div id="mp" class="inner mp"></div></div>
⚡ Энергия<div class="bar"><div id="energy" class="inner energy"></div></div>
⭐ Опыт<div class="bar"><div id="exp" class="inner exp"></div></div>
<div id="logtxt" class="panel"></div></div>
<div id="choice"></div>
<div id="stor"></div>
<img id="slde" class="sld" src="game/ball.webp">
<img id="thund" class="sld" src="game/thund.webp">
<img id="item1" class="item" src="game/crys1.png" onclick="clean(item1)">
<img id="item2" class="item" src="game/crys2.png" onclick="clean(item2)">
<img id="item3" class="item" src="game/crys3.png" onclick="clean(item3)">
<img id="item4" class="item" src="game/crys4.png" onclick="clean(item4)">
<img id="mgbl" src="game/magic.webp" onclick="mbl()">
<img id="coin" src="game/coin.webp" onclick="con()">
</div>

<script>
let pl={lv:1,exp:0,nextExp:100,hp:120,maxHp:120,mp:80,maxMp:80,energy:100,gold:25,ch:0};
function updateUI(){lvl.innerText=pl.lv;
gold.innerText=pl.gold;chpt.innerText=pl.ch;
hp.style.width=(pl.hp/pl.maxHp*100)+"%";
mp.style.width=(pl.mp/pl.maxMp*100)+"%";
energy.style.width=pl.energy+"%";
exp.style.width=(pl.exp/pl.nextExp*100)+"%"}

function addChoice(text,action){let btn=document.createElement("button");btn.textContent=text;
btn.onclick=action;choice.appendChild(btn)}

function clearChoices(){choice.innerHTML="";logtxt.innerHTML=""}
function rand(n){return Math.floor(Math.random()*n)}
function mbl(){stor.innerHTML="♒️"+mb[rand(mb.length)]+"♒️"}
function con(){pl.gold+=15;logtxt.innerHTML="Ты находишь тёмные монеты.";updateUI()}
function changeBg(url){bg.style.backgroundImage=`url(${url})`}

function gainExp(x){pl.exp+=x;
if(pl.exp>=pl.nextExp){pl.exp=0;pl.lv++;
pl.maxHp+=25;pl.maxMp+=15;pl.hp=pl.maxHp;
pl.mp=pl.maxMp;pl.nextExp+=75;
stor.innerHTML="Ты стала сильнее... Но тьма тоже растёт."; changeBg("game/bg-pw1.jpg");for(i=1;i<5;i++)window['item'+i].style.display="block"}updateUI()}

function chooseClass(){changeBg("game/bg0.jpg");
stor.innerHTML="Выбери путь магии. В этом городе свет не всегда побеждает тьму.";clearChoices();
addChoice("✨ Маг света",()=>{pl.ch=0;pl.maxHp+=40;pl.hp=pl.maxHp;startGame()});
addChoice("🌙 Ведьма луны",()=>{pl.ch=1;
pl.maxMp+=40;pl.mp=pl.maxMp;startGame()});
addChoice("🔥 Пламя бездны",()=>{pl.ch=2;startGame()})}

function startGame(){changeBg("game/bg1.jpg");
stor.innerHTML=txt[pl.ch][0];
clearChoices();
addChoice("Исследовать город",cityHub);updateUI()}

function cityHub(){changeBg("game/bg2.jpg");
if(txt[pl.ch][pl.lv])stor.innerHTML=txt[pl.ch][pl.lv];
else stor.innerHTML="Продолжение следует… 🔜";
clearChoices();
addChoice("Башня магов",()=>explore(1,"game/bg-mag.jpg",txt1));
addChoice("Парк мертвых",()=>explore(2,"game/bg-park.jpg",txt2));
addChoice("Порт теней",()=>explore(3,"game/bg-port.jpg",txt3));
addChoice("Подземный разлом",()=>explore(4,"game/bg-rift.jpg",txt4))}

function explore(it,bgpl,place){changeBg(bgpl);
if(place[pl.ch][pl.lv])stor.innerHTML=place[pl.ch][pl.lv];
else stor.innerHTML=place[pl.ch][0];
clearChoices(); let r=rand(5);
if(r==0&&it!=4){battle("game/bt1.jpg","Теневой дух",100,20,false); return}
if(r==0&&it==4){battle("game/bt2.jpg","Страж Разлома",200,30,true);return}
if(r==2&&it==3){pl.energy-=20;logtxt.innerHTML="Шёпот сводит тебя с ума."}
if(it==2&&r!=0){window['item'+r].style.transform="scale(20)";window['item'+r].style.left=rand(45)+"vh";window['item'+r].style.top=rand(48)+22+"vh";setTimeout(()=>window['item'+r].style.transform="scale(0.05)",2000)}
if(it==4&&r!=0){coin.style.left=rand(45)+"vh";coin.style.top=rand(48)+22+"vh";coin.style.display="block";setTimeout(()=>coin.style.display="none",1000)}
if(it==1&&r!=0){mgbl.style.display="block";setTimeout(()=>mgbl.style.display="none",2000)}
addChoice("❮❮❮❮ ️❮❮❮❮ ",cityHub);updateUI()}

function battle(bgbt,name,enemyHp,damage,boss=false){
stor.innerHTML="⚔💀 Бой: 👹 "+name;
clearChoices(); changeBg(bgbt);
function enemyTurn(){pl.hp-=damage;
if(pl.hp<=0)endingBad();updateUI()}
function attack(){slde.style.display="block";setTimeout(()=>slde.style.display="none",1500);
enemyHp-=25+pl.lv*5;
if(enemyHp<=0)setTimeout(victory,1000);else enemyTurn()}

function heavySpell(){if(pl.mp<30){logtxt.innerHTML="Недостаточно маны.";return}
thund.style.display="block";setTimeout(()=>thund.style.display="none",1000);pl.mp-=30;enemyHp-=60;
if(enemyHp<=0){victory()} else{enemyTurn()}updateUI()}

function heal(){if(pl.mp<20){logtxt.innerHTML="Недостаточно маны.";return}
pl.mp-=20;pl.hp+=40;
if(pl.hp>pl.maxHp) pl.hp=pl.maxHp;
enemyTurn();updateUI()}

function victory(){gainExp(boss?150:60);pl.gold+=boss?50:20;
if(boss){stor.innerHTML="Ты разрушила разлом... но чувствуешь, как тьма коснулась души."}
else stor.innerHTML=name+" повержен.";
clearChoices();changeBg("game/bg-pw.jpg");addChoice("Продолжить",cityHub);updateUI()}

addChoice("🗡 Атака 🗡",attack);
addChoice("Мощное заклинание(-30MP)",heavySpell);
addChoice("Исцеление(-20MP)",heal)}

function endingBad(){stor.innerHTML="Тьма поглотила Марго. Город остался без надежды.";
clearChoices(); changeBg("game/bad.jpg");
addChoice("Начать заново",()=>location.reload())}
updateUI();chooseClass();

function clean(ii){ii.style.display="none";gainExp(30);logtxt.innerHTML="Ты очищаешь заражённый символ."}
</script></body></html>
